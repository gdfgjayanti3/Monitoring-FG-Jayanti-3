<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Warehouse Jayanti 3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlxd0ylL1KZNiYAXvosDL8H_M7g8b-naw",
            authDomain: "portal-whmayora-jayanti3.firebaseapp.com",
            projectId: "portal-whmayora-jayanti3",
            storageBucket: "portal-whmayora-jayanti3.firebasestorage.app",
            messagingSenderId: "805832777917",
            appId: "1:805832777917:web:5ba4a61448d97189d4d7d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Pasang fungsi login agar bisa diakses global oleh tombol
        window.prosesLogin = async function() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();
            let errEl = document.getElementById('loginError');

            if(!u || !p) {
                errEl.innerText = "Username dan password wajib diisi!";
                errEl.classList.remove('hidden');
                return;
            }

            try {
                // Mengecek ke koleksi 'users' di Firebase
                const q = query(collection(db, 'users'), where("username", "==", u));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    errEl.innerText = "Username tidak ditemukan!";
                    errEl.classList.remove('hidden');
                    return;
                }

                let userData = null;
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                // Verifikasi password
                if (userData.password === p) {
                    // Simpan sesi login ke browser
                    localStorage.setItem('loggedUser', JSON.stringify(userData));
                    
                    // Semua diarahkan ke index.html (pilihan portal dulu)
                    window.location.href = 'index.html';
                } else {
                    errEl.innerText = "Password salah!";
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Error login:", err);
                errEl.innerText = "Terjadi kesalahan saat menghubungkan ke database.";
                errEl.classList.remove('hidden');
            }
        };
    </script>
    <style>body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 12px; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 max-w-sm w-full space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-xl border border-indigo-100 shadow-2xs">
                <i class="fa-solid fa-warehouse"></i>
            </div>
            <h2 class="font-bold text-slate-700 text-base">Warehouse Login</h2>
            <p class="text-[11px] text-slate-400">PT. Mayora Indah Tbk, Jayanti 3</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="font-bold text-slate-600 block mb-1">Username</label>
                <input type="text" id="loginUser" class="form-control form-control-sm" placeholder="Masukkan username...">
            </div>
            <div>
                <label class="font-bold text-slate-600 block mb-1">Password</label>
                <input type="password" id="loginPass" class="form-control form-control-sm" placeholder="Masukkan password...">
            </div>
            <button onclick="prosesLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition shadow-2xs">
                Masuk Sistem
            </button>
        </div>
        <div id="loginError" class="text-rose-600 text-center font-semibold hidden text-xs"></div>
    </div>
</body>
</html>
